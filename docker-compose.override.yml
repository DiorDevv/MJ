# Local development overrides. `docker compose up` auto-merges this file with
# docker-compose.yml whenever both sit in the same directory, so nothing extra
# is needed for local work — it just re-exposes internal services on the host
# for convenience (curl/psql/direct Vite access), and switches the frontend
# from its production static build back to a hot-reloading dev server.
#
# Production deployments must NOT merge this file: run
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (explicit -f flags disable the automatic override.yml merge), so postgres,
# the backend, and the Vite dev server stay off the public network — only
# nginx should be reachable from outside, and the frontend serves as a
# prebuilt static bundle instead of running `npm run dev`.
services:
  nginx:
    # Dev: the frontend is the Vite dev server on :5173 (below), so nginx must
    # proxy there — not to :80 like the production nginx.http.conf does.
    # Compose de-dupes bind mounts by target, so this replaces the base mount.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Vite restarts often during dev — don't hold nginx hostage to its health
    # (prod keeps the base file's service_healthy gate).
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  postgres:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8001:8000"

  frontend:
    build:
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      # Dev: the Vite dev server on :5173, not the prod nginx on :80.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  speaches:
    ports:
      - "9000:8000"
