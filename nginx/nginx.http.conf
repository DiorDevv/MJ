events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10M;

    upstream backend_upstream {
        server backend:8000;
    }

    # Production: the `frontend` service is the built static bundle served by
    # its own nginx on port 80 (frontend/Dockerfile's "production" stage) —
    # NOT the Vite dev server on 5173 (that's nginx/nginx.conf, dev only).
    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Container healthcheck target (see docker-compose.yml) — served by
        # nginx itself so it does not depend on an upstream being up.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            # No trailing slash on backend_upstream: nginx forwards the request URI
            # unchanged (including the /api/ prefix), matching FastAPI's own routes,
            # which are mounted at /api/v1/... rather than bare /v1/....
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            # No Upgrade/Connection headers — this proxies to a plain static-file
            # nginx, not the Vite dev server's HMR websocket.
            proxy_pass http://frontend_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
