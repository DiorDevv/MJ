services:
  postgres:
    image: postgres:16-alpine
    container_name: mj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port mapping: only reachable from other containers on
    # mj_network. For local psql/DB-client access, see docker-compose.override.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mj_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mj_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    # No host port mapping: reached only via the nginx reverse proxy. For
    # local curl/API-client access, see docker-compose.override.yml.
    volumes:
      - ./backend:/app
    networks:
      - mj_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No target here => builds the last stage in frontend/Dockerfile
      # ("production": a static build served by nginx). Vite bakes
      # VITE_API_URL into the bundle at this build step, so it must be passed
      # as a build arg — a runtime env var would be too late to have any effect.
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: mj_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # No host port mapping: reached only via the nginx reverse proxy. For
    # local direct access to the Vite dev server, see docker-compose.override.yml
    # (which also switches build.target back to "dev").
    networks:
      - mj_network

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: mj_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./telegram_bot:/app/telegram_bot
      - ./shared:/app/shared
    networks:
      - mj_network

  nginx:
    image: nginx:1.27-alpine
    container_name: mj_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mj_network

networks:
  mj_network:
    driver: bridge

volumes:
  postgres_data:
