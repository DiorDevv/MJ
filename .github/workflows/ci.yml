name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mj_user
          POSTGRES_PASSWORD: mj_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mj_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py accepts an explicit DATABASE_URL as long as the db name
      # contains "test"; it creates mj_test_db itself on first run.
      DATABASE_URL: postgresql+asyncpg://mj_user:mj_test_password@localhost:5432/mj_test_db
      SECRET_KEY: ci-secret-key-not-used-anywhere-real-000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: black
        run: black --check app tests
      - name: ruff
        run: ruff check app tests
      - name: mypy
        run: mypy app
      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: test
        run: npm test
      - name: build
        run: npm run build
