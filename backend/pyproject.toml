[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends(...) in argument defaults is the required FastAPI dependency-injection pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["alembic/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "pywebpush.*", "apscheduler.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # Expected cosmetic noise from suppressing the asyncpg/pytest-asyncio
    # loop-teardown race in tests/conftest.py's db_session fixture — the
    # connection is a throwaway NullPool one, not a real leak.
    "ignore:The garbage collector is trying to clean up non-checked-in connection:Warning",
]
