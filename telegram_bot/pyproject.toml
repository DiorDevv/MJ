[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "../backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiogram.*"]
ignore_missing_imports = true
