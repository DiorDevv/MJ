server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed asset filenames (Vite fingerprints these on
    # every build, so a new deploy is never served stale from cache).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file (e.g. /app/today on a hard
    # reload) is served index.html so React Router can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
